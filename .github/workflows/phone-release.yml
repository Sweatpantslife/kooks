name: Phone release

# Builds the phone apps for release. Android: the APK goes on the
# repository's Releases page as a pre-release named after package.json's
# version, signed with the key in the KOOKS_ANDROID_KEYSTORE and
# KOOKS_ANDROID_KEYSTORE_PASSWORD secrets (scripts/android-release-key.sh makes
# them). iPhone: the app goes to TestFlight, signed through the App Store
# Connect API key and certificate key in the APP_STORE_CONNECT_* and
# KOOKS_IOS_CERTIFICATE_KEY secrets (scripts/ios-release-key.sh). Run it from
# the Actions tab, on main; docs/native-app.md describes the whole release.
#
# A pull request that changes a release build runs it too, without the keys:
# Android signs with a throwaway key and iOS builds an unsigned archive, and
# nothing is published.
on:
  workflow_dispatch:
    inputs:
      phones:
        description: Which phones to release for
        type: choice
        options: [both, android, iphone]
        default: both
  pull_request:
    paths:
      - "android/app/build.gradle"
      - "android/build.gradle"
      - "android/variables.gradle"
      - "android/gradle/**"
      - "ios/App/App.xcodeproj/**"
      - "ios/App/App/Info.plist"
      - "scripts/native-version.mjs"
      - "scripts/ios-signing.mjs"
      - ".github/workflows/phone-release.yml"

permissions:
  contents: read

concurrency:
  group: phone-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android release APK
    if: github.event_name != 'workflow_dispatch' || inputs.phones != 'iphone'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Release only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Phone release workflow on main, not on ${GITHUB_REF_NAME}."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Version
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/native-version.mjs
          if ! git diff --exit-code -- android ios; then
            echo "::error::The native projects don't carry version ${version}. Run npm run native:version and commit the result."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=$(node --input-type=module -e 'import { buildNumber } from "./scripts/native-version.mjs"; console.log(buildNumber(process.argv[1]))' "$version")" >> "$GITHUB_OUTPUT"
      - name: Refuse a version that is already released
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" > /dev/null 2>&1; then
            echo "::error::v${VERSION} is already released. Raise the version (npm version patch --no-git-tag-version), merge it, and run this again."
            exit 1
          fi
      - run: npm ci
      - name: Install Android SDK Platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null
      - run: npm run cap:sync
      - name: Build and sign
        env:
          KEYSTORE: ${{ github.event_name == 'workflow_dispatch' && secrets.KOOKS_ANDROID_KEYSTORE || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.KOOKS_ANDROID_KEYSTORE_PASSWORD || '' }}
        run: |
          key="${RUNNER_TEMP}/kooks-release.p12"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ -z "$KEYSTORE" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::The release key is missing. Run scripts/android-release-key.sh once to make it and store it as the KOOKS_ANDROID_KEYSTORE and KOOKS_ANDROID_KEYSTORE_PASSWORD secrets (docs/native-app.md)."
              exit 1
            fi
            printf '%s' "$KEYSTORE" | base64 -d > "$key"
          else
            # A pull request proves the release build signs, with a key made
            # for this run only.
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
              -subj "/CN=Kooks throwaway" -keyout "${RUNNER_TEMP}/key.pem" \
              -out "${RUNNER_TEMP}/cert.pem" 2> /dev/null
            openssl pkcs12 -export -name kooks -inkey "${RUNNER_TEMP}/key.pem" \
              -in "${RUNNER_TEMP}/cert.pem" -passout "pass:${KEYSTORE_PASSWORD}" -out "$key"
            rm "${RUNNER_TEMP}/key.pem"
          fi
          cd android
          KOOKS_ANDROID_KEYSTORE="$key" KOOKS_ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            ./gradlew :app:assembleRelease
          rm "$key"
      - name: Check the APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          apk=android/app/build/outputs/apk/release/app-release.apk
          "${tools}apksigner" verify --min-sdk-version 24 --print-certs "$apk" | tee signers.txt
          "${tools}aapt2" dump badging "$apk" > badging.txt
          sed -n 1p badging.txt
          expected="package: name='app.kooks.household' versionCode='${CODE}' versionName='${VERSION}'"
          if ! sed -n 1p badging.txt | grep -F "$expected" > /dev/null; then
            echo "::error::The APK should start with: ${expected}"
            exit 1
          fi
          if grep '^application-debuggable' badging.txt; then
            echo "::error::The release APK is debuggable."
            exit 1
          fi
          mkdir -p dist
          cp "$apk" "dist/kooks-${VERSION}.apk"
          # apksigner prints "V2 Signer: certificate SHA-256 digest: <hex>"
          # (the scheme varies with minSdk); the first signer is the key.
          certificate=$(awk -F 'digest: ' '/certificate SHA-256 digest: / { print $2; exit }' signers.txt | tr a-f A-F | sed 's/../&:/g; s/:$//')
          if [ -z "$certificate" ]; then
            echo "::error::apksigner printed no signing certificate."
            exit 1
          fi
          checksum=$(sha256sum "dist/kooks-${VERSION}.apk" | cut -d ' ' -f 1)
          cat > dist/release-notes.md <<EOF
          Kooks ${VERSION} for Android phones (Android 7 or newer), built from ${GITHUB_SHA::7}.

          **To install**, open this page on the phone, tap **kooks-${VERSION}.apk** under Assets and open the download. The first time, Android asks you to allow installs from your browser. A newer release installs over this one, and you stay signed in. Step by step: [Install on Android](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/docs/native-app.md#install-on-android).

          What changed is in the [changelog](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).

          | | |
          | --- | --- |
          | Version | ${VERSION} (build ${CODE}) |
          | Signing certificate SHA-256 | \`${certificate}\` |
          | APK SHA-256 | \`${checksum}\` |

          Every release is signed with the same certificate. If this one doesn't match the fingerprint that \`scripts/android-release-key.sh\` printed, don't install it.
          EOF
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'workflow_dispatch' && format('kooks-android-{0}', steps.version.outputs.version) || 'kooks-android-throwaway-key-do-not-install' }}
          path: dist/
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 90 || 7 }}

  publish:
    name: Publish the release
    needs: android
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kooks-android-${{ needs.android.outputs.version }}
          path: dist
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          gh release create "v${VERSION}" "dist/kooks-${VERSION}.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Kooks ${VERSION}" --notes-file dist/release-notes.md
          echo "Published ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iPhone TestFlight upload
    if: github.event_name != 'workflow_dispatch' || inputs.phones != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Release only from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Phone release workflow on main, not on ${GITHUB_REF_NAME}."
          exit 1
      - name: Is TestFlight set up?
        id: setup
        env:
          ISSUER_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_STORE_CONNECT_ISSUER_ID || '' }}
          KEY_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_STORE_CONNECT_KEY_ID || '' }}
          API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.APP_STORE_CONNECT_PRIVATE_KEY || '' }}
          CERTIFICATE_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.KOOKS_IOS_CERTIFICATE_KEY || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$ISSUER_ID" ] && [ -n "$KEY_ID" ] && [ -n "$API_KEY" ] && [ -n "$CERTIFICATE_KEY" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "sign=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::TestFlight isn't set up, so this release has no iPhone build. scripts/ios-release-key.sh sets it up (docs/native-app.md)."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.build == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.setup.outputs.build == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Version
        id: version
        if: steps.setup.outputs.build == 'true'
        run: |
          version=$(node -p 'require("./package.json").version')
          node scripts/native-version.mjs
          if ! git diff --exit-code -- android ios; then
            echo "::error::The native projects don't carry version ${version}. Run npm run native:version and commit the result."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "code=$(node --input-type=module -e 'import { buildNumber } from "./scripts/native-version.mjs"; console.log(buildNumber(process.argv[1]))' "$version")" >> "$GITHUB_OUTPUT"
      - if: steps.setup.outputs.build == 'true'
        run: npm ci
      - if: steps.setup.outputs.build == 'true'
        run: npm run cap:sync
      - run: xcodebuild -version
        if: steps.setup.outputs.build == 'true'
      - name: Get the certificate and profile
        id: signing
        if: steps.setup.outputs.sign == 'true'
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KOOKS_IOS_CERTIFICATE_KEY: ${{ secrets.KOOKS_IOS_CERTIFICATE_KEY }}
        run: |
          umask 077
          out="${RUNNER_TEMP}/ios-signing"
          # Finds or makes the certificate and profile, and switches the App
          # target to manual signing with them (not committed).
          node scripts/ios-signing.mjs "$out"
          keychain="${RUNNER_TEMP}/kooks-signing.keychain-db"
          password=$(openssl rand -hex 16)
          echo "::add-mask::${password}"
          openssl pkcs12 -export -name "Kooks distribution" \
            -inkey "${out}/certificate-key.pem" -in "${out}/certificate.pem" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
            -passout "pass:${password}" -out "${out}/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # The intermediate that issues Apple Distribution certificates.
          curl -fsSL -o "${out}/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "${out}/AppleWWDRCAG3.cer" -k "$keychain" -A
          security import "${out}/certificate.p12" -k "$keychain" -P "$password" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain"
          uuid=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { profileDetails } from "./scripts/ios-signing.mjs"; console.log(profileDetails(readFileSync(process.argv[1])).uuid)' "${out}/profile.mobileprovision")
          for folder in "${HOME}/Library/MobileDevice/Provisioning Profiles" "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$folder"
            cp "${out}/profile.mobileprovision" "${folder}/${uuid}.mobileprovision"
          done
          echo "folder=${out}" >> "$GITHUB_OUTPUT"
          echo "keychain=${keychain}" >> "$GITHUB_OUTPUT"
      - name: Archive
        if: steps.setup.outputs.build == 'true'
        env:
          SIGN: ${{ steps.setup.outputs.sign }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          archive="${RUNNER_TEMP}/Kooks.xcarchive"
          if [ "$SIGN" = true ]; then
            signing=()
          else
            # A pull request proves the device build compiles, unsigned.
            signing=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination generic/platform=iOS \
            -archivePath "$archive" "${signing[@]}" archive
          plist="${archive}/Products/Applications/App.app/Info.plist"
          built="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist") $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "Archived Kooks ${built}"
          if [ "$built" != "${VERSION} ${CODE}" ]; then
            echo "::error::The app says version ${built}, not ${VERSION} ${CODE}."
            exit 1
          fi
      - name: Export the signed app
        id: export
        if: steps.setup.outputs.sign == 'true'
        env:
          FOLDER: ${{ steps.signing.outputs.folder }}
        run: |
          xcodebuild -exportArchive -archivePath "${RUNNER_TEMP}/Kooks.xcarchive" \
            -exportOptionsPlist "${FOLDER}/ExportOptions.plist" \
            -exportPath "${RUNNER_TEMP}/export"
          set -- "${RUNNER_TEMP}"/export/*.ipa
          ipa=$1
          unzip -q "$ipa" -d "${RUNNER_TEMP}/ipa"
          if ! codesign -dvv "${RUNNER_TEMP}"/ipa/Payload/*.app 2>&1 | grep '^Authority=Apple Distribution: '; then
            echo "::error::The app isn't signed with the Apple Distribution certificate."
            exit 1
          fi
          echo "ipa=${ipa}" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        if: steps.setup.outputs.sign == 'true'
        env:
          FOLDER: ${{ steps.signing.outputs.folder }}
          IPA: ${{ steps.export.outputs.ipa }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          # altool finds the API key as ./private_keys/AuthKey_<id>.p8.
          cd "$FOLDER"
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          {
            echo "Kooks ${VERSION} (build ${CODE}) is uploaded to TestFlight."
            echo "Apple processes it for a few minutes; then TestFlight on the iPhone offers it to everyone in the internal testing group."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the keys
        if: always() && steps.setup.outputs.sign == 'true'
        env:
          FOLDER: ${{ steps.signing.outputs.folder }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [ -n "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -rf "${RUNNER_TEMP}/ios-signing" "${RUNNER_TEMP}/ipa"
          rm -f "${HOME}/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision
